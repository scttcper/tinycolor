name: Stage release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to stage, without the v prefix
        required: true
        type: string
      dry_run:
        description: Validate and build without staging a package
        default: false
        type: boolean

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      # https://github.com/actions/checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # https://github.com/pnpm/action-setup
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # https://github.com/actions/setup-node
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const version = process.env.RELEASE_VERSION;
          assert.match(version, /^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/, 'Expected a stable version such as 4.2.1');
          const response = await fetch('https://registry.npmjs.org/@ctrl%2ftinycolor');
          assert.ok(response.ok, `Registry lookup failed: ${response.status}`);
          const metadata = await response.json();
          assert.ok(!Object.hasOwn(metadata.versions, version), `${version} is already published`);
          NODE
          test "$(gh release view "v$RELEASE_VERSION" --json isDraft --jq .isDraft)" = true
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: node --run lint
      - name: Test
        run: node --run test:ci
      - name: Set package version
        run: npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts
      - name: Build and pack
        run: |
          node --run build
          npm pack --ignore-scripts
      - name: Preview package
        if: inputs.dry_run
        run: npm stage publish "ctrl-tinycolor-$RELEASE_VERSION.tgz" --dry-run --ignore-scripts
      - name: Update draft release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "v$RELEASE_VERSION" "ctrl-tinycolor-$RELEASE_VERSION.tgz" --clobber
          gh release edit "v$RELEASE_VERSION" --target "$GITHUB_SHA"
      - name: Stage npm package
        if: ${{ !inputs.dry_run }}
        run: npm stage publish "ctrl-tinycolor-$RELEASE_VERSION.tgz" --access public --provenance --ignore-scripts
